[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "googleads-mcp"
version = "0.1.0"
description = "MCP server for querying Google Ads via GAQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2",
    "google-ads",
    "pandas",
    "python-dotenv",
]

[project.scripts]
googleads-mcp = "googleads_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["googleads_mcp"]
